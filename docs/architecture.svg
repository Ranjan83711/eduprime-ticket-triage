<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6B85"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/>
    </marker>
  </defs>
  <rect width="1280" height="440" fill="#FFFFFF"/>

  <!-- main row: boxes 150 wide, 25 gap, starting x=25 -->
  <g font-size="15" text-anchor="middle">
    <rect x="25" y="100" width="150" height="90" rx="12" fill="#F2F4F8" stroke="#8A9BB8" stroke-width="1.5"/>
    <text x="100" y="135" font-weight="700" fill="#14213D">Student ticket</text>
    <text x="100" y="157" fill="#4A5568" font-size="13">Email · WhatsApp</text>
    <text x="100" y="175" fill="#4A5568" font-size="13">· web form</text>

    <rect x="200" y="100" width="150" height="90" rx="12" fill="#FFF4EC" stroke="#C2410C" stroke-width="2"/>
    <text x="275" y="135" font-weight="700" fill="#14213D">Pre-checks</text>
    <text x="275" y="157" fill="#4A5568" font-size="13">regex rules</text>
    <text x="275" y="175" fill="#4A5568" font-size="13">no LLM</text>

    <rect x="375" y="100" width="150" height="90" rx="12" fill="#EEF4FD" stroke="#2A63C6" stroke-width="1.5"/>
    <text x="450" y="135" font-weight="700" fill="#14213D">Classify</text>
    <text x="450" y="157" fill="#4A5568" font-size="13">Gemini Flash-Lite</text>
    <text x="450" y="175" fill="#4A5568" font-size="13">JSON schema</text>

    <rect x="550" y="100" width="150" height="90" rx="12" fill="#F2F4F8" stroke="#8A9BB8" stroke-width="1.5"/>
    <text x="625" y="135" font-weight="700" fill="#14213D">Retrieve</text>
    <text x="625" y="157" fill="#4A5568" font-size="13">BM25 over</text>
    <text x="625" y="175" fill="#4A5568" font-size="13">51 KB passages</text>

    <rect x="725" y="100" width="150" height="90" rx="12" fill="#EEF4FD" stroke="#2A63C6" stroke-width="1.5"/>
    <text x="800" y="135" font-weight="700" fill="#14213D">Draft reply</text>
    <text x="800" y="157" fill="#4A5568" font-size="13">Gemini Flash-Lite</text>
    <text x="800" y="175" fill="#4A5568" font-size="13">+ exact quotes</text>

    <rect x="900" y="100" width="150" height="90" rx="12" fill="#FFF4EC" stroke="#C2410C" stroke-width="2"/>
    <text x="975" y="135" font-weight="700" fill="#14213D">Verify citations</text>
    <text x="975" y="157" fill="#4A5568" font-size="13">quote must exist</text>
    <text x="975" y="175" fill="#4A5568" font-size="13">in the passage</text>

    <rect x="1075" y="100" width="180" height="90" rx="12" fill="#14213D"/>
    <text x="1165" y="135" font-weight="700" fill="#F7F6F1">Escalation rule</text>
    <text x="1165" y="157" fill="#C9D3E6" font-size="13">plain Python</text>
    <text x="1165" y="175" fill="#C9D3E6" font-size="13">reasons listed</text>
  </g>

  <!-- arrows along the main row -->
  <g stroke="#5B6B85" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="175" y1="145" x2="197" y2="145"/>
    <line x1="350" y1="145" x2="372" y2="145"/>
    <line x1="525" y1="145" x2="547" y2="145"/>
    <line x1="700" y1="145" x2="722" y2="145"/>
    <line x1="875" y1="145" x2="897" y2="145"/>
    <line x1="1050" y1="145" x2="1072" y2="145"/>
  </g>

  <!-- outcomes -->
  <g font-size="15" text-anchor="middle">
    <rect x="800" y="262" width="200" height="78" rx="12" fill="#E6F2EA" stroke="#2F7A45" stroke-width="1.5"/>
    <text x="900" y="292" font-weight="700" fill="#14532D">Auto-reply</text>
    <text x="900" y="314" fill="#1F3B2A" font-size="13">same email thread /</text>
    <text x="900" y="331" fill="#1F3B2A" font-size="13">WhatsApp chat</text>

    <rect x="1040" y="262" width="220" height="78" rx="12" fill="#FBE7DF" stroke="#C2410C" stroke-width="1.5"/>
    <text x="1150" y="292" font-weight="700" fill="#7C2D12">Escalate to a team</text>
    <text x="1150" y="314" fill="#4A2A1C" font-size="13">ack to student + senior</text>
    <text x="1150" y="331" fill="#4A2A1C" font-size="13">alert; agent approves draft</text>
  </g>
  <g stroke="#5B6B85" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M1110,190 L930,259"/>
    <line x1="1165" y1="190" x2="1165" y2="259"/>
  </g>
  <g font-size="13" fill="#4A5568">
    <text x="955" y="208" text-anchor="middle">all checks pass</text>
    <text x="1175" y="230">any rule fires</text>
  </g>

  <!-- fallback -->
  <rect x="490" y="262" width="270" height="62" rx="12" fill="#FFFFFF" stroke="#8A9BB8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="625" y="289" font-size="15" font-weight="700" fill="#14213D" text-anchor="middle">Groq gpt-oss-120b</text>
  <text x="625" y="310" font-size="13" fill="#4A5568" text-anchor="middle">fallback on rate limit / error</text>
  <g stroke="#8A9BB8" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)">
    <path d="M450,190 L540,259"/>
    <path d="M800,190 L710,259"/>
  </g>

  <!-- critical path: pre-checks straight to escalation -->
  <path d="M275,190 L275,395 L1150,395 L1150,343" stroke="#C2410C" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arrowRed)"/>
  <text x="290" y="386" font-size="13" fill="#C2410C">critical flag (self-harm, prompt injection): skip the LLM, go straight to a senior human</text>

  <!-- legend -->
  <g font-size="13" fill="#4A5568">
    <rect x="25" y="30" width="18" height="14" rx="3" fill="#FFF4EC" stroke="#C2410C" stroke-width="2"/>
    <text x="50" y="42">deterministic code, no model</text>
    <rect x="265" y="30" width="18" height="14" rx="3" fill="#EEF4FD" stroke="#2A63C6" stroke-width="1.5"/>
    <text x="290" y="42">LLM call</text>
    <text x="1255" y="42" text-anchor="end">LangGraph state machine · traced in LangSmith</text>
  </g>
</svg>
